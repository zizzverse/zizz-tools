<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZIZZ Tools</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <div class="logo">ZIZZ</div>

        <button class="search-btn" id="searchBtn">
            🔍
        </button>
    </header>


    <main>

        <section class="welcome">
            <h1>Welcome to ZIZZ Tools</h1>
            <p>Useful tools, all in one place.</p>
        </section>


        <section class="section">

            <div class="section-title">
                <h2>Popular Tools</h2>
                <span>See all</span>
            </div>


            <div class="tools-grid">

                <button class="tool-card">
                    <span class="tool-icon">🧮</span>
                    <strong>Calculator</strong>
                    <small>Calculate anything</small>
                </button>


                <button class="tool-card" onclick="location.href='tools/unit-converter.html'">
    <span class="tool-icon">📏</span>
    <strong>Unit Converter</strong>
    <small>Convert units</small>
                </button>


                <button class="tool-card" onclick="location.href='tools/currency.html'">
    <span class="tool-icon">💰</span>
    <strong>Currency</strong>
    <small>Currency converter</small>
                </button>


                <button class="tool-card" onclick="location.href='tools/calculator.html'">
    <span class="tool-icon">🧮</span>
    <strong>Calculator</strong>
    <small>Calculate anything</small>
                </button>


                <button class="tool-card">
                    <span class="tool-icon">📝</span>
                    <strong>Notes</strong>
                    <small>Write your notes</small>
                </button>


                <button class="tool-card">
                    <span class="tool-icon">⏱️</span>
                    <strong>Timer</strong>
                    <small>Set a timer</small>
                </button>

            </div>

        </section>


        <section class="section">

            <div class="section-title">
                <h2>AI Tools</h2>
            </div>


            <div class="ai-grid">

                <button class="ai-card">
                    🤖
                    <strong>AI Chat</strong>
                </button>

                <button class="ai-card">
                    ✍️
                    <strong>AI Writer</strong>
                </button>

                <button class="ai-card">
                    🌐
                    <strong>Translator</strong>
                </button>

                <button class="ai-card">
                    #️⃣
                    <strong>Hashtag Generator</strong>
                </button>

            </div>

        </section>

    </main>


    <nav class="bottom-nav">

        <button class="nav-item active">
            🏠
            <span>Home</span>
        </button>

        <button class="nav-item">
            🧰
            <span>Tools</span>
        </button>

        <button class="nav-item">
            🤖
            <span>AI</span>
        </button>

        <button class="nav-item">
            ⭐
            <span>Favorites</span>
        </button>

        <button class="nav-item">
            ⚙️
            <span>Settings</span>
        </button>

    </nav>


    <script src="js/app.js"></script>

</body>
</html>
